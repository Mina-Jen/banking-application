# The Spring Boot backend, as reachable on the compose network. The browser only
# ever talks to this nginx origin, so /api/... requests are same-origin and the
# backend needs no CORS configuration -- the same trick as the Vite dev proxy.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/css text/javascript application/javascript
                      application/json image/svg+xml;

    # Plain liveness endpoint for the container healthcheck and any external
    # monitor; it does not touch the backend.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite fingerprints these filenames, so they can be cached forever.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        # React Router handles routing in the browser, so an unknown path must
        # return index.html instead of 404.
        try_files  $uri $uri/ /index.html;
    }
}
